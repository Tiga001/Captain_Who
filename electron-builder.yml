appId: io.github.tiga001.captainwho
productName: Captain Who
copyright: Copyright © 2026 ShenhuaJiao
# Development and non-macOS builds have no update provider. scripts/update-config.mjs validates
# CAPTAIN_WHO_UPDATE_URL and enables a macOS arm64 provider for update-enabled releases only.
publish: null
afterPack: ./scripts/verify-packaged-app.mjs
afterSign: ./scripts/verify-packaged-app.mjs
directories:
  buildResources: build
files:
  - out/**/*
  - resources/**/*
  - '!node_modules/node-addon-api/**/*'
  - '!node_modules/node-pty/deps/**/*'
  - '!node_modules/node-pty/scripts/**/*'
  - '!node_modules/node-pty/src/**/*'
  - '!node_modules/node-pty/third_party/**/*'
  - '!node_modules/node-pty/typings/**/*'
  - '!node_modules/node-pty/prebuilds/**/*'
  - '!node_modules/node-pty/lib/**/*.map'
  - '!node_modules/node-pty/lib/**/*.test.js'
  - '!node_modules/@electron-toolkit/utils/dist/*.d.*'
asarUnpack:
  - resources/**
extraResources:
  - from: .cache/officecli/current
    to: components/officecli
  - from: .cache/office-renderer/current
    to: components/office-renderer
  - from: .cache/word-pdf-renderer/current
    to: components/word-pdf-renderer
  - from: .cache/artifact-runtime/current
    to: components/artifact-runtime
  - from: THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: THIRD_PARTY_GRAMMAR_NOTICES.txt
    to: THIRD_PARTY_GRAMMAR_NOTICES.txt
  - from: node_modules/electron/dist/LICENSE
    to: LICENSE.electron.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html
win:
  executableName: CaptainWho
  artifactName: Captain-Who-${version}-${arch}.${ext}
  # Preserve the frozen renderer receipt. The application and its other executables are still
  # signed; only the application-managed Chromium binary is excluded from a second Authenticode
  # mutation after its bytes have been verified and frozen.
  signExts:
    - '!chrome-headless-shell.exe'
  extraResources:
    - from: target/release/core-server.exe
      to: core-server.exe
nsis:
  artifactName: Captain-Who-${version}-${arch}-Setup.${ext}
  differentialPackage: false
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
  artifactName: Captain-Who-${version}-${arch}.${ext}
  # The base configuration is for builds without an update source. The dynamic release config
  # adds arm64 ZIP + update metadata when CAPTAIN_WHO_UPDATE_URL is configured.
  target:
    - dmg
  # build:mac additionally enables forceCodeSigning. This custom signer gives the Rust helper a
  # stable designated requirement while preserving electron-builder's normal recursive signing
  # policy for the application and Electron helpers.
  sign: ./scripts/sign-macos.mjs
  type: distribution
  hardenedRuntime: true
  strictVerify: true
  entitlementsInherit: build/entitlements.mac.plist
  # The custom signer signs the exact frozen Mach-O inventories in these managed components and
  # refreshes only their hashes before the top-level application seals Resources. Exclude each
  # directory from osx-sign's second recursive pass so it cannot mutate data files or signed bytes
  # behind the refreshed receipts. LibreOffice keeps its valid upstream Developer ID signatures.
  signIgnore:
    - /Contents/Resources/components/artifact-runtime/
    - /Contents/Resources/components/officecli/
    - /Contents/Resources/components/office-renderer/
    - /Contents/Resources/components/word-pdf-renderer/
  extraResources:
    - from: target/release/core-server
      to: core-server
  extendInfo:
    NSDocumentsFolderUsageDescription: Captain Who accesses files you select in Documents.
    NSDownloadsFolderUsageDescription: Captain Who accesses files you select in Downloads.
  # Signing is mandatory for build:mac. Notarization remains an independent release operation
  # until CI has an Apple notary credential contract; it must never be confused with signing.
  notarize: false
dmg:
  # Sign the distributable container itself. The application inside already carries the complete
  # hardened Developer ID signature chain. The dynamic release config enables update metadata.
  sign: true
  writeUpdateInfo: false
  artifactName: Captain-Who-${version}-${arch}.${ext}
linux:
  artifactName: Captain-Who-${version}-${arch}.${ext}
  extraResources:
    - from: target/release/core-server
      to: core-server
  target:
    - AppImage
    - snap
    - deb
  maintainer: ShenhuaJiao
  category: Utility
appImage:
  artifactName: Captain-Who-${version}-${arch}.${ext}
npmRebuild: false
