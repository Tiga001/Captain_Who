<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>MyCopilot</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: mycopilot-resource:; frame-src 'self' http: https:"
    />
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      .app-bootstrap-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(244, 244, 242, 0.58);
        backdrop-filter: saturate(1.12);
        -webkit-backdrop-filter: saturate(1.12);
        -webkit-app-region: no-drag;
      }

      .app-bootstrap-screen__drag-region {
        position: absolute;
        z-index: 1;
        top: 0;
        right: 0;
        left: 0;
        height: 52px;
        -webkit-app-region: drag;
      }

      .app-bootstrap-screen__icon {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        object-fit: contain;
        animation: app-bootstrap-icon-pulse 1800ms ease-in-out infinite;
        -webkit-user-drag: none;
        user-select: none;
      }

      .app-bootstrap-screen__content {
        display: grid;
        max-width: min(360px, calc(100vw - 48px));
        justify-items: center;
        gap: 18px;
        text-align: center;
      }

      .app-bootstrap-screen__ambient {
        display: flex;
        width: min(320px, calc(100vw - 64px));
        min-height: 22px;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        color: #737b86;
        font:
          400 14px/22px -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        letter-spacing: 0;
        text-overflow: ellipsis;
        white-space: nowrap;
        opacity: 1;
        transition: opacity 180ms ease;
        user-select: none;
      }

      .app-bootstrap-screen__ambient[data-phase='fading'] {
        opacity: 0;
      }

      .app-bootstrap-screen__sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes app-bootstrap-icon-pulse {
        0%,
        100% {
          opacity: 0.82;
          transform: scale(0.98);
        }

        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-color-scheme: dark) {
        .app-bootstrap-screen {
          background: rgba(23, 23, 23, 0.58);
        }

        .app-bootstrap-screen__ambient {
          color: #969ca5;
        }
      }

      @media (prefers-reduced-transparency: reduce) {
        .app-bootstrap-screen {
          background: #f4f4f2;
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
        }
      }

      @media (prefers-color-scheme: dark) and (prefers-reduced-transparency: reduce) {
        .app-bootstrap-screen {
          background: #171717;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-bootstrap-screen__icon {
          animation: none;
        }

        .app-bootstrap-screen__ambient {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- This lightweight shell is localized before React replaces it with AppStartupGate. -->
      <div class="app-bootstrap-screen" role="status" aria-labelledby="app-bootstrap-status">
        <div class="app-bootstrap-screen__drag-region" aria-hidden="true"></div>
        <div class="app-bootstrap-screen__content">
          <picture>
            <source data-bootstrap-startup-icon-dark media="(prefers-color-scheme: dark)" />
            <img
              class="app-bootstrap-screen__icon"
              data-bootstrap-startup-icon
              alt=""
              aria-hidden="true"
              draggable="false"
            />
          </picture>
          <div
            class="app-bootstrap-screen__ambient"
            data-bootstrap-startup-ambient
            aria-hidden="true"
          ></div>
          <span
            id="app-bootstrap-status"
            class="app-bootstrap-screen__sr-only"
            data-bootstrap-startup-label
          ></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/features/startup/bootstrapStartupEntry.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
