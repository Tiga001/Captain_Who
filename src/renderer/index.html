<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>MyCopilot</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: mycopilot-resource:; frame-src 'self' http: https:"
    />
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      .app-bootstrap-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f4f4f2;
        -webkit-app-region: no-drag;
      }

      .app-bootstrap-screen__drag-region {
        position: absolute;
        z-index: 1;
        top: 0;
        right: 0;
        left: 0;
        height: 52px;
        -webkit-app-region: drag;
      }

      .app-bootstrap-screen__icon {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        object-fit: contain;
        animation: app-bootstrap-icon-pulse 1800ms ease-in-out infinite;
        -webkit-user-drag: none;
        user-select: none;
      }

      .app-bootstrap-screen__content {
        display: grid;
        max-width: min(360px, calc(100vw - 48px));
        justify-items: center;
        gap: 18px;
        text-align: center;
      }

      .app-bootstrap-screen__ambient {
        display: flex;
        width: min(320px, calc(100vw - 64px));
        min-height: 22px;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        color: #737b86;
        font:
          400 14px/22px -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        letter-spacing: 0;
        text-overflow: ellipsis;
        white-space: nowrap;
        user-select: none;
      }

      @keyframes app-bootstrap-icon-pulse {
        0%,
        100% {
          opacity: 0.82;
          transform: scale(0.98);
        }

        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-color-scheme: dark) {
        .app-bootstrap-screen {
          background: #171717;
        }

        .app-bootstrap-screen__ambient {
          color: #969ca5;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-bootstrap-screen__icon {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- This zero-JavaScript shell is the first paint. React replaces it with AppStartupGate. -->
      <div class="app-bootstrap-screen" role="status" aria-label="Starting MyCopilot">
        <div class="app-bootstrap-screen__drag-region" aria-hidden="true"></div>
        <div class="app-bootstrap-screen__content">
          <img
            class="app-bootstrap-screen__icon"
            src="../../resources/icon.png"
            alt=""
            aria-hidden="true"
            draggable="false"
          />
          <div class="app-bootstrap-screen__ambient" aria-hidden="true">正在深度思考</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
