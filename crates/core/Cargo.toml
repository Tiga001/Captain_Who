[package]
name = "mycopilot-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mycopilot_core"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
dirs = "6"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
keyring = "4"
libc = "0.2"
lopdf = { version = "0.44", default-features = false }
# The desktop Core must follow the same macOS/Windows system proxy and enterprise trust store as
# Electron; disabling reqwest defaults without these features breaks model traffic under VPNs.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots", "stream", "system-proxy"] }
ring = "0.17.14"
roxmltree = "0.21"
rusqlite = { version = "0.32", features = ["backup", "bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml.workspace = true
sha2 = "0.10"
unicode-segmentation = "1.12"
unicode-normalization = "0.1"
similar = "2"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"
uuid.workspace = true
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
zeroize = "1"
zstd = "0.13"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["trace"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"
