[package]
name = "mycopilot-core"
version.workspace = true
edition.workspace = true

[lib]
name = "mycopilot_core"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
dirs = "6"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
keyring = "4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
pdf-extract = "0.12"
roxmltree = "0.21"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml.workspace = true
sha2 = "0.10"
similar = "2"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
uuid.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
zeroize = "1"
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"
