[package]
name = "mycopilot-core-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "core-server"
path = "src/main.rs"

[[test]]
name = "mcp_stdio_runtime_e2e"
path = "tests/mcp_stdio_runtime_e2e.rs"
harness = false

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
libc = "0.2"
mycopilot-core.workspace = true
mycopilot-mcp-client.workspace = true
mycopilot-protocol-rs.workspace = true
ring = "0.17.14"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
tracing = "0.1"
tracing-subscriber = "0.3"
uuid.workspace = true
zeroize = "1.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
rmcp = { workspace = true, features = ["macros", "server", "transport-io"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1"
tempfile = "3"
