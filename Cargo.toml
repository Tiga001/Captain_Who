# Rust core server.
[workspace]
members = [
  "crates/protocol-rs",
  "crates/core",
  "crates/core-server",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
mycopilot-core = { path = "crates/core" }
mycopilot-protocol-rs = { path = "crates/protocol-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }
