# Rust workspace.
[workspace]
members = [
  "crates/protocol-rs",
  "crates/core",
  "crates/core-server",
  "crates/mcp-client",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
mycopilot-core = { path = "crates/core" }
mycopilot-mcp-client = { path = "crates/mcp-client" }
mycopilot-protocol-rs = { path = "crates/protocol-rs" }
rmcp = { version = "=3.0.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "=0.10.0" }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
